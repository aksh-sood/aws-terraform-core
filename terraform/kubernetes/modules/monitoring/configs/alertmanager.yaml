#do not remove this comment (added here to maintain yaml formating ) also do not remove the tab space at the start of each line 
  enabled: true
  config:
    global:
      slack_api_url: ${slack_web_hook}
    route:
      receiver: default
      group_by:
        - alertname
        - cluster
        - service
        - job
      continue: false
      routes:
        - receiver: "empty"
          match:
            alertname: Watchdog
          continue: true
        - receiver: "empty"
          match_re:
            alertname: "KubeSchedulerDown|KubeControllerManagerDown|KubeAPIDown|KubeProxyDown|KubeletDown"
          continue: false
        - receiver: "gchat_sns_receiver"
          match:
            severity: warning
          continue: true
        - receiver: "gchat_sns_receiver"
          match:
            severity: critical
          continue: true
        - receiver: "slack"
          match:
            severity: warning
          continue: true
        - receiver: "pagerduty"
          match:
            severity: critical
          continue: true
      group_wait: 2m
      group_interval: 5m
      repeat_interval: 15m
    receivers:
      - name: "empty"
      - name: 'gchat_sns_receiver'
        sns_configs:
        - topic_arn: ${gchat_sns_topic_arn}
          subject: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
          attributes:
            gchat_url: ${gchat_webhook_url}
          sigv4:
            region: ${aws_region}
      - name: default
        slack_configs:
          - send_resolved: false
            http_config:
              follow_redirects: true
            channel: ${slack_channel_name}
            title: |-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} for {{ .CommonLabels.job }}
              {{- if gt (len .CommonLabels) (len .GroupLabels) -}}
                {{" "}}(
                {{- with .CommonLabels.Remove .GroupLabels.Names }}
                  {{- range $index, $label := .SortedPairs -}}
                    {{ if $index }}, {{ end }}
                    {{- $label.Name }}="{{ $label.Value -}}"
                  {{- end }}
                {{- end -}}
                )
              {{- end }}
            text: >-
              {{ range .Alerts -}}
              *Alert:* {{ .Annotations.title }}{{ if .Labels.severity }} - `{{ .Labels.severity }}`{{ end }}
              *Description:* {{ .Annotations.description }}
              *Details:*
                {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
                {{ end }}
              {{ end }}
      - name: pagerduty
        pagerduty_configs:
          - service_key: ${pagerduty_key}
            send_resolved: true
      - name: slack
        slack_configs:
          - send_resolved: true
            channel: ${slack_channel_name}
            title: |-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} for {{ .CommonLabels.job }}
              {{- if gt (len .CommonLabels) (len .GroupLabels) -}}
                {{" "}}(
                {{- with .CommonLabels.Remove .GroupLabels.Names }}
                  {{- range $index, $label := .SortedPairs -}}
                    {{ if $index }}, {{ end }}
                    {{- $label.Name }}="{{ $label.Value -}}"
                  {{- end }}
                {{- end -}}
                )
              {{- end }}
            text: >-
              {{ range .Alerts -}}
              *Alert:* {{ .Annotations.title }}{{ if .Labels.severity }} - `{{ .Labels.severity }}`{{ end }}
              *Description:* {{ .Annotations.description }}
              *Details:*
                {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
                {{ end }}
              {{ end }}
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "${alertmanager_storage_class}"
          accessModes:
            - ${alertmanager_access_mode}
          resources:
            requests:
              storage: ${alert_manager_volume_size}
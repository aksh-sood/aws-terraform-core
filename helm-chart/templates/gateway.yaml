{{- if .Values.istio.gateway.enabled -}}
{{- /*
Configures listeners on the shared ingress gateway deployment selected below —
it does not create one. That deployment must already exist with matching
labels, otherwise this object is accepted and simply programmes nothing.

One plain-HTTP server, because TLS is terminated upstream at the load balancer
in front of the gateway. To terminate here instead, add an HTTPS server with
tls.mode SIMPLE and a credentialName naming a secret in the *gateway's*
namespace, and set tls.httpsRedirect on this one.
*/ -}}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ include "deploy-service.gatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deploy-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.istio.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        {{- toYaml .Values.istio.hosts | nindent 8 }}
{{- end }}

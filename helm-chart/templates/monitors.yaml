{{- if .Values.metrics.serviceMonitor.enabled -}}
{{- /*
The labels on this object are what the Prometheus instance selects
ServiceMonitors on (serviceMonitorSelector); the selector inside the spec is
what picks up this chart's Service. Getting the first wrong means the target is
never scraped and nothing reports an error.
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "deploy-service.fullname" . }}
  namespace: {{ default (include "deploy-service.namespace" .) .Values.metrics.serviceMonitor.namespace }}
  labels:
    {{- include "deploy-service.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "deploy-service.namespace" . }}
  selector:
    matchLabels:
      {{- include "deploy-service.selectorLabels" . | nindent 6 }}
  endpoints:
    {{- toYaml .Values.metrics.serviceMonitor.endpoints | nindent 4 }}
{{- end }}

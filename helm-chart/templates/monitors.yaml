{{- if .Values.metrics.enabled -}}
{{- /*
The two labels below are what the platform's Prometheus selects ServiceMonitors
on (its serviceMonitorSelector). Get them wrong and the target is simply never
scraped — nothing reports an error. The selector inside the spec is what picks
up this chart's Service.
*/ -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "deploy-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deploy-service.labels" . | nindent 4 }}
    prometheus: prometheus-kube-prometheus-prometheus
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "deploy-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: {{ .Values.metrics.path }}
      interval: 30s
      scrapeTimeout: 10s
{{- end }}

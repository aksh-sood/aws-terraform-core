apiVersion: v1
kind: Service
metadata:
  name: {{ include "deploy-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deploy-service.labels" . | nindent 4 }}
spec:
  # ClusterIP is the right type behind an Istio gateway: the gateway is the only
  # client, and exposing the app is the VirtualService's job.
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      # How Istio decides this port speaks HTTP, and so what L7 features
      # (routing, retries, metrics) apply to it.
      appProtocol: http
  selector:
    {{- include "deploy-service.selectorLabels" . | nindent 4 }}

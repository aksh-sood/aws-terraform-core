{{- if .Values.istio.virtualService.enabled -}}
{{- $vs := .Values.istio.virtualService -}}
{{- $gateways := $vs.gateways | default list -}}
{{- if not $gateways -}}
  {{- if .Values.istio.gateway.enabled -}}
    {{- /* Namespace-qualified: an unqualified name resolves in the gateway's
           own namespace, not this one, which silently drops the route. */ -}}
    {{- $gateways = append $gateways (printf "%s/%s" (include "deploy-service.namespace" .) (include "deploy-service.gatewayName" .)) -}}
  {{- end -}}
  {{- if $vs.includeMesh -}}
    {{- $gateways = append $gateways "mesh" -}}
  {{- end -}}
{{- end -}}
apiVersion: {{ .Values.istio.apiVersion }}
kind: VirtualService
metadata:
  name: {{ include "deploy-service.virtualServiceName" . }}
  namespace: {{ include "deploy-service.namespace" . }}
  labels:
    {{- include "deploy-service.labels" . | nindent 4 }}
    {{- with $vs.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with merge (deepCopy ($vs.annotations | default dict)) (deepCopy (.Values.commonAnnotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  hosts:
    {{- include "deploy-service.virtualServiceHosts" . | nindent 4 }}
  {{- with $gateways }}
  gateways:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $vs.exportTo }}
  exportTo:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  http:
    {{- if $vs.http }}
    {{- toYaml $vs.http | nindent 4 }}
    {{- else }}
    - match:
        - uri:
            {{ $vs.route.matchType | default "prefix" }}: {{ $vs.route.match | default "/" | quote }}
      route:
        - destination:
            host: {{ include "deploy-service.serviceHost" . }}
            port:
              number: {{ include "deploy-service.routePort" . }}
          weight: 100
      {{- with $vs.route.rewriteUri }}
      rewrite:
        uri: {{ . | quote }}
      {{- end }}
      {{- with $vs.route.timeout }}
      timeout: {{ . }}
      {{- end }}
      {{- with $vs.route.retries }}
      retries:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $vs.route.corsPolicy }}
      corsPolicy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $vs.route.headers }}
      headers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}

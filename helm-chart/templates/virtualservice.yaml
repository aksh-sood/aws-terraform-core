{{- if .Values.istio.virtualService.enabled -}}
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "deploy-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deploy-service.labels" . | nindent 4 }}
spec:
  hosts:
    {{- toYaml .Values.istio.hosts | nindent 4 }}
  gateways:
    {{- if .Values.istio.gateway.enabled }}
    # Namespace-qualified: an unqualified name resolves in the gateway's own
    # namespace, not this one, which silently drops the route.
    - {{ .Release.Namespace }}/{{ include "deploy-service.gatewayName" . }}
    {{- end }}
    # Serves the same hostnames to in-cluster callers, so clients do not need a
    # different address than external ones.
    - mesh
  http:
    - match:
        - uri:
            prefix: {{ .Values.istio.virtualService.prefix | quote }}
      route:
        - destination:
            host: {{ include "deploy-service.serviceHost" . }}
            port:
              number: {{ .Values.service.port }}
      timeout: {{ .Values.istio.virtualService.timeout }}
      # Only conditions where the request provably never reached the app, so a
      # retry is safe even for a non-idempotent handler. Adding 5xx or
      # retriable-status-codes here would not be: a 500 from a handler that
      # already committed a write would be replayed.
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: connect-failure,refused-stream,gateway-error
{{- end }}

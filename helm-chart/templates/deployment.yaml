{{- include "deploy-service.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "deploy-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "deploy-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Enough history to roll back, without keeping every past revision.
  revisionHistoryLimit: 3
  # A pod that passes readiness and then immediately falls over does not count
  # as a successful step in the rollout.
  minReadySeconds: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Full capacity through a rollout: a replacement is Ready before an old
      # pod goes away. Costs headroom for one extra pod.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "deploy-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "deploy-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "deploy-service.serviceAccountName" . }}
      # The app makes no Kubernetes API calls, so no token is projected. An
      # injected Istio sidecar is unaffected — it mounts its own istio-token.
      automountServiceAccountToken: false
      # Satisfies the restricted Pod Security Standard. uid 65532 is what the
      # default image already runs as; change both together for another image.
      # An injected sidecar sets its own context and is not affected by this.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Time to finish in-flight requests after SIGTERM.
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ include "deploy-service.name" . }}
          image: {{ include "deploy-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          {{- with .Values.env }}
          env:
            {{- range $name, $value := . }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Startup absorbs a slow boot so liveness can stay tight afterwards.
          # Readiness gates traffic; liveness only restarts a wedged process, so
          # it is deliberately more forgiving than readiness.
          startupProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ .Values.healthPath }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # readOnlyRootFilesystem means a writable /tmp has to come from a
          # volume.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Multi-AZ placement. DoNotSchedule on the zone key leaves a pod Pending
      # rather than letting every replica land in one AZ — the failure mode a
      # soft constraint hides until that AZ goes away. The cost is that uneven
      # node capacity across zones caps the deployment; relax this one to
      # ScheduleAnyway if that is the wrong trade.
      #
      # matchLabelKeys scopes the skew calculation to the ReplicaSet being
      # rolled out, so a rollout is not blocked by pods of the old revision.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "deploy-service.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              {{- include "deploy-service.selectorLabels" . | nindent 14 }}

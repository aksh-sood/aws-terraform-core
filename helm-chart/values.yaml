# -----------------------------------------------------------------------------
# deploy-service
#
# Only the settings that genuinely vary between deployments are exposed here.
# Everything else — security context, rollout strategy, probe timings, topology
# spread, retries, the Istio api version — is fixed in the templates, with the
# reasoning next to each value. See README.md for what is fixed and how to
# change it if you have to.
#
# The defaults deploy a working "Hello World" with no extra values.
# -----------------------------------------------------------------------------

# Replaces the generated "<release>-<chart>" name on every object.
fullnameOverride: ""

image:
  repository: hashicorp/http-echo
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
# - name: regcred

# Three or more spreads across availability zones; see the topology spread
# constraints in templates/deployment.yaml.
replicaCount: 1

# Appended to the image ENTRYPOINT. These are http-echo's flags — clear them
# when you point image at your own service.
args:
  - -listen=:8080
  - -text=Hello World

# Port the container listens on. Named "http" everywhere downstream.
containerPort: 8080

# Simple name/value pairs. Use envFrom for anything from a Secret or ConfigMap.
env: {}
#  LOG_LEVEL: info

envFrom: []
# - secretRef:
#     name: app-secrets

# One path serves all three probes. The default image answers every path;
# point this at a real health endpoint for a real service.
healthPath: /

# A CPU request with no CPU limit lets the container burst into idle capacity
# instead of being throttled, while the request still guarantees a floor.
# Memory is request == limit: memory is not compressible, so a higher limit
# only defers the OOM kill.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 64Mi

podAnnotations: {}

# Istio sidecar injection is normally a namespace label. Set it per pod here
# when the namespace is not labelled — both keys are needed:
#   sidecar.istio.io/inject: "true"
#   istio.io/rev: default
podLabels: {}

nodeSelector: {}
tolerations: []

serviceAccount:
  # A dedicated ServiceAccount leaves the namespace default unused and gives
  # IRSA something to bind to. Named after the release.
  create: true
  # e.g. eks.amazonaws.com/role-arn
  annotations: {}

service:
  # Always ClusterIP — the ingress gateway is the only client.
  port: 80

# -----------------------------------------------------------------------------
# Istio ingress
#
# The Gateway is the listener on the shared ingress gateway deployment; the
# VirtualService routes a hostname to this Service. Both live in this namespace,
# so the app owns its routing instead of a shared cluster-wide object.
# -----------------------------------------------------------------------------

istio:
  # Hostnames served, shared by the Gateway and the VirtualService.
  hosts:
    - hello-world.example.com

  gateway:
    enabled: true
    # Must match the labels on the ingress gateway deployment to bind to it.
    selector:
      istio: ingressgateway

  virtualService:
    enabled: true
    prefix: /
    # An outer bound on a request. Istio's own default is no timeout at all.
    timeout: 15s

# Scrape target for the platform's Prometheus. Off by default: a target that
# 404s is worse than none, so enable it once the app serves metrics on the
# port above.
metrics:
  enabled: false
  path: /metrics
